<template>

    <lightning-card
        title="Invoice"
        icon-name="standard:orders">

        <div class="slds-p-horizontal_medium slds-p-bottom_medium">

            <!-- Header -->
            <div
                class="slds-grid
                       slds-grid_align-spread
                       slds-grid_vertical-align-center
                       slds-m-bottom_medium">

                <div>

                    <h2 class="slds-text-heading_small">
                        Billing Period
                    </h2>

                </div>

                <div>

                    <lightning-button
                        variant="brand"
                        label="Generate Invoice"
                        onclick={handleGenerateInvoice}
                        disabled={buttonDisabled}>
                    </lightning-button>

                </div>

            </div>

            <!-- Billing Dates -->
            <div class="slds-grid slds-gutters">

                <div class="slds-col slds-size_1-of-2">

                    <lightning-input
    type="date"
    label="Billing Start Date"
    value={billingStartDate}
    onchange={handleBillingStartDateChange}
    required>
</lightning-input>

                </div>

                <div class="slds-col slds-size_1-of-2">

                    <lightning-input
    type="date"
    label="Billing End Date"
    value={billingEndDate}
    onchange={handleBillingEndDateChange}
    required>
</lightning-input>

                </div>

            </div>

            <!-- Status -->
            <template lwc:if={jobStatus}>

                <div
                    class="slds-m-top_medium
                           slds-text-body_regular">

                    Status:
                    <strong>{jobStatus}</strong>

                </div>

            </template>

            <!-- Spinner -->
            <template lwc:if={isGenerating}>

                <div class="slds-is-relative slds-m-top_medium">

                    <lightning-spinner
                        alternative-text="Generating invoice">
                    </lightning-spinner>

                </div>

            </template>

            <!-- Error -->
            <template lwc:if={errorMessage}>

                <div
                    class="slds-m-top_medium
                           slds-text-color_error">

                    {errorMessage}

                </div>

            </template>

        </div>

    </lightning-card>

</template>
